# ============================================================
# 站点基本信息
# ============================================================
site_name: Sonder的学习笔记
site_description: 计算机与深度学习课程笔记
site_author: Sonder
# 部署到 GitHub Pages 后请把下面两行改成你自己的仓库信息
site_url: https://sonderzhiming-arch.github.io/my-notes/
repo_url: https://github.com/sonderzhiming-arch/my-notes
repo_name: sonderzhiming-arch/my-notes

# 站点语言：中文
theme:
  name: material
  language: zh
  # ----------------------------------------------------------
  # 深色 / 浅色模式切换（跟随系统，也可手动切换）
  # 配色用 custom，具体颜色由 extra_css 里的主题文件决定
  # ----------------------------------------------------------
  palette:
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  icon:
    logo: material/notebook-edit-outline   # 左上角图标
  features:
    - navigation.tabs          # 顶部课程标签栏
    - navigation.sections      # 左侧导航分区
    - navigation.path          # 页面标题上方的面包屑
    - navigation.footer        # 页面底部「上一页 / 下一页」
    - navigation.top           # 返回顶部按钮
    - navigation.tracking      # URL 随滚动更新到当前章节
    - navigation.indexes       # 允许分区带索引页
    - search.suggest           # 搜索建议
    - search.highlight         # 搜索结果高亮
    - content.code.copy        # 代码块一键复制
    - toc.follow               # 右侧目录跟随滚动
  # 不从 Google Fonts 加载字体：国内经常连不上，会卡住页面渲染。
  # 改用系统自带的中文字体，字体栈见 stylesheets/extra.css
  font: false

# ============================================================
# 插件
# ============================================================
plugins:
  - search:
      lang:
        - zh          # 中文分词搜索
        - en

# ============================================================
# Markdown 扩展
# ============================================================
markdown_extensions:
  # 提示框 admonition（!!! note / warning / tip ...）
  - admonition
  - pymdownx.details          # 可折叠提示框
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true         # 标题旁生成锚点链接
  # 代码高亮
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:     # 代码块 / 嵌套围栏
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  # 图标短代码，如 :material-atom:、:octicons-arrow-right-24:（首页卡片在用）
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # LaTeX 数学公式（配合 MathJax）
  - pymdownx.arithmatex:
      generic: true

# ============================================================
# MathJax 支持 LaTeX 数学公式
# mathjax.js 只在页面里有公式时才去加载 MathJax（约 1 MB），其余页面不加载
# ============================================================
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/home.js     # 首页大搜索框

extra_css:
  - stylesheets/extra.css           # 所有方案共用的版式
  - stylesheets/themes/ink.css      # 视觉方案：换方案只改这一行（ink / minimal / aurora / candy）

copyright: © 2026 Sonder · 资料仅供学习交流

extra:
  generator: false   # 页脚不显示「Made with Material for MkDocs」
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sonderzhiming-arch/my-notes
      name: GitHub 仓库

# files/ 里的 Markdown 是资料本身（从各列表页链接过去），不需要出现在左侧导航
not_in_nav: |
  /**/files/**/*.md

# ============================================================
# 导航结构
# ============================================================
