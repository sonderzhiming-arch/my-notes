      - 期末复习: physics/final-review.md
      - 期末真题: physics/final-exams.md
  - 微积分（甲）Ⅱ:
      - calculus/index.md
      - 课件 PPT: calculus/slides.md
      - 讲义: calculus/notes.md
      - 习题解答: calculus/exercises.md
      - 期中: calculus/midterm.md
      - 期末: calculus/final.md
  - 数据结构基础:
      - data-structure/index.md
      - 课件 PPT: data-structure/slides.md
      - 讲义: data-structure/notes.md
      - 期中复习: data-structure/midterm.md
      - 期中真题: data-structure/midterm-exams.md
      - 期末真题: data-structure/final-exams.md
      - 课程要求: data-structure/syllabus.md
  - 离散数学及其应用:
      - discrete-math/index.md
      - 课件 PPT: discrete-math/slides.md
      - 复习讲义: discrete-math/notes.md
      - 历年卷: discrete-math/past-papers.md
      - 期中: discrete-math/midterm.md
      - 期末复习: discrete-math/final-review.md
      - 朋辈辅导: discrete-math/peer.md
  - 计算机系统 I:
      - computer-system/index.md
      - 课件 PPT: computer-system/slides.md
      - 讲义: computer-system/notes.md
      - 期末复习讲义: computer-system/final-review-notes.md
      - 期末资料: computer-system/final.md
      - 教材: computer-system/textbook.md
